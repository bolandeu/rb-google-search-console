[project]
name = "rb-google-search-console"
version = "0.1.0"
description = "Google Search Console + PageSpeed Insights: библиотека, CLI и MCP-сервер"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.26.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
oauth = ["google-auth-oauthlib>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
rb-gsc = "rb_gsc.cli:main"

[project.entry-points."mcp.servers"]
rb-google-search-console = "rb_gsc.mcp_server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_gsc"]
