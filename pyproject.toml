[project]
name = "gsc"
version = "0.1.0"
description = "Google Search Console и PageSpeed Insights: библиотека gsc и CLI — ресурсы, поисковая аналитика, инспекция URL, карты сайта, скорость страниц"
readme = "README.md"
authors = [{ name = "bolandeu" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "google-oauth",
]

[project.scripts]
gsc = "gsc.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/google-search-console"

# google-oauth — общая авторизация Google для всех инструментов (ключи в общем слоте keychain).
# ВРЕМЕННО path: репозитория bolandeu/google-oauth на GitHub ещё нет. После его создания заменить на
# google-oauth = { git = "https://github.com/bolandeu/google-oauth.git" } (как yandex-oauth у ywm):
# с path `uv tool install git+…` на другой машине не соберётся.
[tool.uv.sources]
google-oauth = { path = "../google-oauth", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Сейчас ~97%; планку не опускать — новая команда без тестов должна падать здесь.
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Тексты и комментарии на русском: кириллица — не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                # assert is the point of a test
"scripts/*" = ["S603", "S607"]      # subprocess with fixed argv lists (git, uv), no shell

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
